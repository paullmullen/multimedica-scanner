<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Multimédica</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        text-align: center;
        max-width: 500px;
        padding: 40px;
      }

      .logo {
        font-size: 56px;
        font-weight: 800;
        margin-bottom: 32px;
        letter-spacing: 0.04em;
      }

      .title {
        font-size: 34px;
        font-weight: 700;
        margin-bottom: 14px;
      }

      .subtitle {
        font-size: 20px;
        opacity: 0.75;
        margin-bottom: 36px;
      }

      .steps {
        text-align: left;
        line-height: 2;
        font-size: 20px;
        opacity: 0.92;
      }

      .step.pending {
        opacity: 0.4;
      }

      .spinner {
        margin: 40px auto 0 auto;
        width: 48px;
        height: 48px;
        border: 5px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="logo">Multimédica</div>

      <div class="title">Iniciando sistema...</div>

      <div class="subtitle">Preparando pantalla clínica</div>

      <div class="steps">
        <div>✓ Cargando configuración</div>
        <div>✓ Inicializando pantalla</div>
        <div>✓ Conectando servicios</div>
        <div class="step pending">Sincronizando estado clínico...</div>
      </div>

      <div class="spinner"></div>
    </div>

    <script>
      async function waitForServer() {
        try {
          const response = await fetch("/api/display?boot=1", {
            cache: "no-store",
          });

          if (response.ok) {
            window.location.replace("/");
            return;
          }
        } catch (err) {}

        setTimeout(waitForServer, 1000);
      }

      waitForServer();
    </script>
  </body>
</html>
