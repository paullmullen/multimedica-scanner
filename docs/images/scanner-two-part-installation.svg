<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Two-part Multimédica scanner installation</title>
  <desc id="desc">A clean Raspberry Pi first receives the bootstrap platform and commissioning, then an approved production release is installed, promoted, and verified.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#283593"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #283593; }
      .step { font: 700 23px Arial, sans-serif; fill: #ffffff; }
      .heading { font: 700 22px Arial, sans-serif; fill: #283593; }
      .body { font: 18px Arial, sans-serif; fill: #273043; }
      .note { font: 700 19px Arial, sans-serif; fill: #273043; }
      .line { stroke: #283593; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="610" rx="24" fill="#f7f9fc" stroke="#d9deea" stroke-width="2"/>
  <text x="600" y="52" text-anchor="middle" class="title">Two-Part Scanner Installation</text>

  <rect x="445" y="82" width="310" height="66" rx="16" fill="#2bb3a8"/>
  <text x="600" y="124" text-anchor="middle" class="step">Clean Raspberry Pi</text>

  <path d="M600 148 L600 182 L305 182 L305 218" class="line"/>
  <path d="M600 148 L600 182 L895 182 L895 218" class="line"/>

  <rect x="90" y="220" width="430" height="250" rx="20" fill="#ffffff" stroke="#2bb3a8" stroke-width="4"/>
  <rect x="90" y="220" width="430" height="62" rx="18" fill="#2bb3a8"/>
  <path d="M90 264 L90 282 L520 282 L520 264" fill="#2bb3a8"/>
  <text x="305" y="260" text-anchor="middle" class="step">1. Bootstrap Platform</text>
  <text x="125" y="325" class="heading">Installs the appliance foundation</text>
  <text x="125" y="365" class="body">• Display and kiosk</text>
  <text x="125" y="398" class="body">• Scanner input and commissioning</text>
  <text x="125" y="431" class="body">• Release management and recovery</text>

  <rect x="680" y="220" width="430" height="250" rx="20" fill="#ffffff" stroke="#283593" stroke-width="4"/>
  <rect x="680" y="220" width="430" height="62" rx="18" fill="#283593"/>
  <path d="M680 264 L680 282 L1110 282 L1110 264" fill="#283593"/>
  <text x="895" y="260" text-anchor="middle" class="step">2. Production Release</text>
  <text x="715" y="325" class="heading">Installs approved daily software</text>
  <text x="715" y="365" class="body">• Versioned production package</text>
  <text x="715" y="398" class="body">• Candidate check and promotion</text>
  <text x="715" y="431" class="body">• Production health verification</text>

  <path d="M305 470 L305 518 L895 518 L895 470" stroke="#9aa5bd" stroke-width="4" fill="none"/>
  <rect x="300" y="520" width="600" height="58" rx="15" fill="#eef1f7" stroke="#9aa5bd" stroke-width="2"/>
  <text x="600" y="556" text-anchor="middle" class="note">Both parts must pass verification before clinic use</text>
</svg>
